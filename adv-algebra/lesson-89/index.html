const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const math = s => `<span class="math">${s}</span>`;
const pow = (s,n=2) => `${s}<sup>${n}</sup>`;
const frac = (a,b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const root = s => `<span class="root"><span class="root-symbol">√</span><span class="radicand">${s}</span></span>`;
const display = s => `<div class="display-math">${s}</div>`;
const panel = (s,caption='') => `<div class="formula-panel"><div class="formula">${s}</div>${caption?`<div class="caption">${caption}</div>`:''}</div>`;
const callout = (title,text) => `<div class="callout"><strong>${title}</strong>${text}</div>`;
const choice = (label,html) => ({label,html});
const mono = (co,exps,vars=['x','y','z']) => `${co<0?'−':''}${Math.abs(co)===1?'':Math.abs(co)}${exps.map((n,i)=>n===0?'':vars[i]+(n===1?'':`<sup>${n}</sup>`)).join('')}`;
const letters=['A','B','C','D','E'];
const makeChoices = a => a.map((html,i)=>choice(letters[i],html));
function distinctMonoOptions(raw, correctIndex, coefficient, exps, vars=['x','y','z']){
 const used=new Set([raw[correctIndex]]);
 return raw.map((s,i)=>{
  if(i===correctIndex)return s;
  let replacement=coefficient+101+i;
  while(used.has(s)){s=mono(replacement++,exps,vars);}
  used.add(s);return s;
 });
}


const lessons = [
{id:'pattern',title:'A square is a product',short:'The plus pattern',intro:'A binomial has two terms. Squaring it means multiplying the entire binomial by itself—not just squaring each term.',body:
 `<p>In this lesson, <strong>standard forms</strong> are common algebra patterns worth recognizing. The first is the square of a sum:</p>${panel('(x + a)<sup>2</sup> = x<sup>2</sup> + 2ax + a<sup>2</sup>','Square the first term. Add twice the product. Add the square of the second term.')}
 <p>Distribute each term in the first factor to <em>both</em> terms in the second. There are four products; the two middle products combine.</p>`,
 steps:[['Write the square as a product.',math('(x + a)<sup>2</sup> = (x + a)(x + a)')],['Distribute all four products.',math('x · x + x · a + a · x + a · a = x<sup>2</sup> + ax + ax + a<sup>2</sup>')],['Combine the like terms.',math('ax + ax = 2ax')+'; so the result is '+math('x<sup>2</sup> + 2ax + a<sup>2</sup>')+'.']],
 after:`<p>The letters can change without changing the pattern:</p>${panel('(x + b)<sup>2</sup> = x<sup>2</sup> + 2bx + b<sup>2</sup><br>(x + c)<sup>2</sup> = x<sup>2</sup> + 2cx + c<sup>2</sup><br>(x + y)<sup>2</sup> = x<sup>2</sup> + 2xy + y<sup>2</sup>')}${callout('A useful distinction','Expanding turns a product into a sum. Factoring reverses that process.')}`,
 mini:{prompt:'Which expression is equivalent to '+math('(x + 2)<sup>2</sup>')+'?',options:['x<sup>2</sup> + 4','x<sup>2</sup> + 4x + 4','x<sup>2</sup> + 2x + 4'],correct:1,explain:'The middle term is 2 · x · 2 = 4x, and the last term is 2² = 4.'}},
{id:'minus',title:'What changes with a minus?',short:'The minus pattern',intro:'The middle term changes sign. The last term stays positive because a negative times a negative is positive.',body:
 `${panel('(x − a)<sup>2</sup> = x<sup>2</sup> − 2ax + a<sup>2</sup>','A squared difference still has three terms after expansion.')}
 <p>Compare the two patterns: the first and last terms are squares in both. The sign between the original terms determines the sign of the middle term.</p>`,
 steps:[['Write both factors.',math('(x − a)<sup>2</sup> = (x − a)(x − a)')],['Multiply every pair.',math('x<sup>2</sup> − ax − ax + a<sup>2</sup>')],['Combine the middle terms.',math('x<sup>2</sup> − 2ax + a<sup>2</sup>')+' because '+math('−ax − ax = −2ax')+'.']],
 after:`${panel('(x − b)<sup>2</sup> = x<sup>2</sup> − 2bx + b<sup>2</sup><br>(x − c)<sup>2</sup> = x<sup>2</sup> − 2cx + c<sup>2</sup><br>(x − y)<sup>2</sup> = x<sup>2</sup> − 2xy + y<sup>2</sup>')}${callout('Do not lose the middle term',math('(x − a)<sup>2</sup>')+' is not '+math('x<sup>2</sup> − a<sup>2</sup>')+'. The latter factors as '+math('(x + a)(x − a)')+', which has different factors.')}
 <div id="pattern-lab"></div>`,
 mini:{prompt:'Expand '+math('(m − 3)<sup>2</sup>')+'.',options:['m<sup>2</sup> − 9','m<sup>2</sup> − 6m − 9','m<sup>2</sup> − 6m + 9'],correct:2,explain:'The middle term is −2 · m · 3 = −6m. The final term is (−3)(−3) = +9.'}},
{id:'factor',title:'Run the pattern backward',short:'Factoring & one variable',intro:'A perfect-square trinomial is the expanded form of a squared binomial. To factor it, recognize the squares and check the middle term.',body:

/* A small numeric parser. It deliberately does not execute JavaScript or accept
   arbitrary identifiers. Supported: decimals, fractions, mixed numbers,
   + - * / ^, parentheses, square roots, and scientific e notation. */
function parseNumber(raw){
 let s=String(raw??'').trim().toLowerCase().replace(/[−–—]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/√/g,'sqrt').replace(/²/g,'^2').replace(/³/g,'^3');
 if(!s)throw Error('Enter an answer first.');
 if(s.length>160)throw Error('Please use a shorter numeric answer.');
 if(/^(no\s*(real\s*)?solutions?|none|no\s*solution\s*exists|∅)$/.test(s))return null;
 s=s.replace(/^[a-z]\s*=\s*/,'').replace(/\s*(hours?|hrs?|h|units?)\s*$/,'').trim();
 if(/,/.test(s)){
  if(!/^[+-]?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))throw Error('Use commas only as thousands separators, or remove them.');
  s=s.replace(/,/g,'');
 }
 const mixed=s.match(/^([+-]?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
 if(mixed){const den=Number(mixed[4]);if(den===0)throw Error('A denominator cannot be zero.');return(mixed[1]==='-'?-1:1)*(Number(mixed[2])+Number(mixed[3])/den);}
 const tokens=[];let pos=0;
 while(pos<s.length){
  if(/\s/.test(s[pos])){pos++;continue;}
  const rest=s.slice(pos),n=rest.match(/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/);
  if(n){tokens.push({t:'n',v:Number(n[0])});pos+=n[0].length;}
  else if(rest.startsWith('sqrt')){tokens.push({t:'sqrt'});pos+=4;}
  else if('+-*/^()'.includes(s[pos]))tokens.push({t:s[pos++]});
  else throw Error('Use a number, a fraction, or sqrt(...). Only numeric arithmetic is supported.');
  if(tokens.length>100)throw Error('Please simplify your numeric answer.');
 }
 let i=0,depth=0;
 const peek=()=>tokens[i]?.t;
 const ensureFinite=v=>{if(!Number.isFinite(v))throw Error('That expression does not give a finite real number.');return v;};
 function atom(){
  if(++depth>25)throw Error('There are too many nested parentheses.');let val;
  if(peek()==='n')val=tokens[i++].v;
  else if(peek()==='('){i++;val=expression();if(peek()!==')')throw Error('Close every opening parenthesis.');i++;}
  else if(peek()==='sqrt'){i++;val=atom();if(val<0)throw Error('A real square root cannot have a negative radicand.');val=Math.sqrt(val);}
  else throw Error('Check your number, signs, and parentheses.');
  depth--;return ensureFinite(val);
 }
 function power(){let v=atom();if(peek()==='^'){i++;let ex=unary();if(Math.abs(ex)>100)throw Error('The exponent is too large.');v=Math.pow(v,ex);}return ensureFinite(v);}
 function unary(){if(peek()==='+'){i++;return unary();}if(peek()==='-'){i++;return -unary();}return power();}
 function term(){let v=unary();while(peek()==='*'||peek()==='/'){const op=tokens[i++].t,w=unary();if(op==='/'&&w===0)throw Error('A denominator cannot be zero.');v=op==='*'?v*w:v/w;ensureFinite(v);}return v;}
 function expression(){let v=term();while(peek()==='+'||peek()==='-'){const op=tokens[i++].t,w=term();v=op==='+'?v+w:v-w;ensureFinite(v);}return v;}
 const result=expression();if(i!==tokens.length)throw Error('Check the expression. Use * explicitly for multiplication.');return ensureFinite(result);
}
function grade(q,draft){
 const parts=[];
 if(q.choices){
  if(!Number.isInteger(draft?.choice)||draft.choice<0||draft.choice>=q.choices.length)return{valid:false,error:q.type==='trip'?'Choose an equation before submitting.':'Select one answer before submitting.'};
  parts.push({label:q.type==='trip'?'Equation':'Choice',correct:draft.choice===q.correct});
 }
 if(q.fields){
  for(const field of q.fields){
   const raw=draft?.values?.[field.key]??'';if(!String(raw).trim())return{valid:false,error:'Fill in '+field.label.replace(/ =$/,'')+' before submitting.',field:field.key};
   let parsed;try{parsed=parseNumber(raw);}catch(e){return{valid:false,error:field.label+': '+e.message,field:field.key};}
   let correct=field.value===null?parsed===null:parsed!==null&&Math.abs(parsed-field.value)<=(field.tolerance||0)+1e-12;
   if(q.type==='scientific'&&field.key==='coefficient')correct=correct&&parsed!==null&&Math.abs(parsed)>=1&&Math.abs(parsed)<10;
   if(q.type==='scientific'&&field.key==='exponent')correct=correct&&Number.isInteger(parsed);
   parts.push({label:field.label.replace(/ =$/,''),correct});

function hintsHTML(q,r){return r.hints?`<div class="hint-box">${q.hints.slice(0,r.hints).map((h,i)=>`<p><strong>Hint ${i+1}</strong>${h}</p>`).join('')}</div>`:'';}
function solutionHTML(q,open=true){return `<details class="solution" id="solution-${q.id}" ${open?'open':''}><summary>Worked solution</summary><div class="solution-inner"><div class="solution-answer">${math(q.answerHTML)}</div><ol>${q.solution.map(s=>`<li>${s}</li>`).join('')}</ol>${q.check?`<div class="check"><strong>Check:</strong> ${q.check}</div>`:''}</div></details>`;}
function feedbackHTML(q,r){

 if(r.feedback==='correct')return `<div class="feedback" role="status"><h3>${r.firstCorrect?'Correct on the first attempt.':'You worked it through.'}</h3><p>${r.firstCorrect?'You earned this exercise’s first-attempt point.':'Your corrected answer is right. Your original first-attempt score stays unchanged, and this exercise is now counted as solved.'}</p><p class="small">${r.attempts.length} ${r.attempts.length===1?'submission':'submissions'} · ${r.hints} ${r.hints===1?'hint':'hints'} used</p></div>`;
 if(r.feedback==='revealed')return `<div class="feedback wrong" role="status"><h3>Solution reviewed.</h3><p>This exercise is complete for the lesson, but it is not counted as independently solved. Its first-attempt point is 0. Read each step below before continuing.</p></div>`;
 return `<div class="feedback wrong" role="status"><h3>Not quite yet. You can revise your answer.</h3><p>${q.type==='scientific'?'Check the coefficient, the decimal-place count, and the sign of the exponent.':q.type==='trip'?'Check both your equation and the outward travel time.':q.fields?.length>1?'Review the parts below and adjust your answer.':'Use the work guide or a hint, then try again.'}</p>${last?.parts?.length>1?`<div class="part-status">${last.parts.map(p=>`<span>${p.correct?'✓':'↻'} ${p.label}: ${p.correct?'correct':'review'}</span>`).join('')}</div>`:''}<p class="small">First-attempt point: 0. A correction will improve your solved count, not replace the original score.</p></div>`;
}

function stats(qs=questions){return{total:qs.length,first:qs.filter(q=>rec(q).firstCorrect===true).length,solved:qs.filter(q=>rec(q).solved).length,revealed:qs.filter(q=>rec(q).revealed&&!rec(q).solved).length,corrected:qs.filter(q=>rec(q).solved&&!rec(q).firstCorrect).length,hints:qs.reduce((n,q)=>n+rec(q).hints,0),hinted:qs.filter(q=>rec(q).hints>0).length,attempts:qs.reduce((n,q)=>n+rec(q).attempts.length,0)};}
function plain(s){const node=document.createElement('div');node.innerHTML=s;$$('.frac',node).forEach(n=>n.replaceWith('('+n.children[0].textContent+')/('+n.children[1].textContent+')'));$$('sup',node).forEach(n=>n.replaceWith('^'+n.textContent));$$('sub',node).forEach(n=>n.replaceWith('_'+n.textContent));$$('br',node).forEach(n=>n.replaceWith(' '));return node.textContent.replace(/\s+/g,' ').trim();}
function draftText(q,d){const pieces=[];if(q.choices&&Number.isInteger(d?.choice)&&q.choices[d.choice])pieces.push(q.choices[d.choice].label+'. '+plain(q.choices[d.choice].html));for(const f of q.fields||[])pieces.push(f.label.replace(/ =$/,'')+': '+(d?.values?.[f.key]||'not entered'));return pieces.join(' · ');}
function resultStatus(r){return r.firstCorrect?['First try · 1 pt','']:r.solved?['Corrected · 0 pts','retry']:['Solution reviewed · 0 pts','retry'];}
function resultRow(q){const r=rec(q),[label,cls]=resultStatus(r),first=r.attempts[0];return `<details class="result-row"><summary><span class="result-title"><strong>${q.section==='practice'?'Practice':'Problem'} ${q.label}</strong><span class="muted">${q.skill}</span>${q.sourceKey&&!state.source[q.sourceKey].confirmed?'<span class="tag warn">Source check</span>':''}</span><span class="status-pill ${cls}">${label}</span></summary><div class="result-detail"><p><strong>First submission:</strong> ${first?esc(draftText(q,first.draft)):'No answer submitted before the solution was revealed.'}</p>${r.attempts.length>1?`<p><strong>Latest submission:</strong> ${esc(draftText(q,r.attempts.at(-1).draft))}</p>`:''}<p><strong>Submissions:</strong> ${r.attempts.length} · <strong>Hints:</strong> ${r.hints} · <strong>Solved:</strong> ${r.solved?'Yes':'No; solution reviewed'}</p>${r.notes?`<p><strong>Your work:</strong></p><p style="white-space:pre-wrap">${esc(r.notes)}</p>`:''}${q.sourceKey?`<p class="small muted">${state.source[q.sourceKey].confirmed?'Expression marked checked by the user.':'Working transcription not yet checked.'}${q.regenerated?' Answer choices were regenerated.':''}</p>`:''}<button class="text-btn no-print" data-action="concept" data-id="${q.lesson}">Review this concept</button>${solutionHTML(q,false)}</div></details>`;}
function results(){
 if(!allDone())return intro('problem');const s=stats(),p=stats(sectionQuestions('practice')),b=stats(sectionQuestions('problem'));const percentage=Math.round(s.first/s.total*1000)/10;
 const filtered=questions.filter(q=>state.reportFilter==='all'||(state.reportFilter==='missed'&&!rec(q).firstCorrect)||q.section===state.reportFilter);
 const needs=lessons.map(l=>({l,n:questions.filter(q=>q.lesson===l.id&&!rec(q).firstCorrect).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,3);
 return `<section><div class="results-top"><div><div class="eyebrow">Your lesson report</div><h1>Lesson complete${state.name?',<br><em>'+esc(state.name)+'.</em>':'.'}</h1><p class="lesson-intro">You worked through all 26 exercises. This report keeps your first attempt separate from what you learned through hints, corrections, and solutions.</p><p class="small muted">Lesson 89 · Standard Forms${state.completedAt?' · '+esc(new Date(state.completedAt).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})):''}</p></div><div class="score-panel"><div class="score-big">${percentage}%</div><div class="score-fraction">${s.first} / ${s.total} points</div><div class="score-label">First-attempt lesson score</div></div></div>
 <div class="score-breakdown"><div class="tile"><h3>Practice 89</h3><div class="value">${p.first} / 5</div><p>First-attempt points · ${p.solved} solved</p></div><div class="tile"><h3>Problem Set 89</h3><div class="value">${b.first} / 21</div><p>First-attempt points · ${b.solved} solved</p></div></div>
 <div class="result-stats"><div class="result-stat"><span class="number">${s.solved} / 26</span><span class="label">Solved, including retries</span></div><div class="result-stat"><span class="number">${s.corrected}</span><span class="label">Solved after a correction</span></div><div class="result-stat"><span class="number">${s.revealed}</span><span class="label">Finished with a solution</span></div><div class="result-stat"><span class="number">${s.hints}</span><span class="label">Hints across ${s.hinted} exercises</span></div></div>
 <p class="small muted">Each exercise is worth one first-attempt point; multi-part exercises require every part correct. Hints do not deduct points. The unscored lesson quick checks are not included.</p>${sourceNote()}
 ${needs.length?`<div class="review-banner"><strong>A useful next review:</strong> ${needs.map(({l,n})=>`<button class="text-btn" data-action="concept" data-id="${l.id}">${l.short} (${n})</button>`).join('')}<div class="small">Numbers show exercises in that topic not correct on the first attempt.</div></div>`:`<div class="review-banner"><strong>Every first submission was correct.</strong> You can still open any exercise below to review its reasoning.</div>`}
 <div class="btn-row no-print"><button class="btn" data-action="download-report">Save lesson report</button><button class="btn secondary" data-action="print-report">Print report</button><button class="btn secondary" data-action="save-progress">Save progress file</button><button class="text-btn" data-action="reset">Start a new attempt</button></div>
 <div class="divider"></div><h2 style="font-size:1.85rem">Your exercise review</h2><p class="small muted">Open an exercise to see your response history, workspace, and worked solution.</p><div class="report-filter no-print" role="group" aria-label="Filter exercise results">${[['all','All 26'],['missed','Corrections & solutions'],['practice','Practice 89'],['problem','Problem Set 89']].map(([k,t])=>`<button class="btn secondary small ${state.reportFilter===k?'selected':''}" data-action="filter" data-filter="${k}" aria-pressed="${state.reportFilter===k}">${t}</button>`).join('')}</div><div class="result-list">${filtered.length?filtered.map(resultRow).join(''):'<div class="notice info">No exercises in this category. Every first submission was correct.</div>'}</div><div class="print-only">Generated by Lesson 89 · Standard Forms. Scores apply to the displayed exercises. This is a local practice report, not a secured assessment record.</div></section>`;
}
function render(){workflow();const main=$('#main');main.innerHTML=state.view==='home'?home():state.view==='learn'?learn():state.view==='practice-intro'?intro('practice'):state.view==='problem-intro'?intro('problem'):state.view==='results'?results():questionView(state.view);if(state.view==='learn')renderLab();updateSaveStatus();document.title=(state.view==='results'?'Your results':state.view==='learn'?lessons[state.lessonIndex].short:state.view==='practice'?'Practice 89 · '+getQuestion().label:state.view==='problem'?'Problem Set 89 · '+getQuestion().label:'Lesson 89')+' · Standard Forms';}
function resume(){
 if(!state.startedAt)state.startedAt=new Date().toISOString();
 if(allDone()){setView('results');return;}
 if(state.read.length<lessons.length){state.lessonIndex=lessons.findIndex(l=>!state.read.includes(l.id));setView('learn');return;}
 if(sectionDone('practice')<5){state.indices.practice=sectionQuestions('practice').findIndex(q=>!rec(q).done);setView('practice');return;}
 state.indices.problem=sectionQuestions('problem').findIndex(q=>!rec(q).done);setView('problem');
}
function doSubmit(){
 if(!['practice','problem'].includes(state.view))return;const q=getQuestion(),r=rec(q);if(r.done)return;
 captureDraft();const res=grade(q,r.draft);if(!res.valid){inputError=res;render();const focus=res.field?$('#answer-'+res.field):$('.choice');focus?.focus({preventScroll:true});announce(res.error);return;}
 inputError=null;
 const attempt={draft:clone(r.draft),correct:res.correct,parts:res.parts,at:new Date().toISOString(),hints:r.hints};r.attempts.push(attempt);
 if(r.firstCorrect===null)r.firstCorrect=res.correct;r.feedback=res.correct?'correct':'wrong';
 if(res.correct){r.done=true;r.solved=true;r.solutionOpen=true;}
 finishCheck();save();render();const box=$('.feedback');box?.scrollIntoView({block:'nearest',behavior:'smooth'});announce(res.correct?'Correct. '+(r.firstCorrect?'One first-attempt point earned.':'Your correction is counted as solved.'):'Not quite. You may revise your answer.');
}
function captureDraft(){if(!['practice','problem'].includes(state.view))return;const r=rec(getQuestion());$$('.answer-input').forEach(i=>r.draft.values[i.dataset.field]=i.value.slice(0,160));const scratch=$('#scratchpad');if(scratch)r.notes=scratch.value.slice(0,5000);}

function chooseAnswer(index){const q=getQuestion(),r=rec(q);if(r.done||!q.choices||!validInt(index,0,q.choices.length-1))return;captureDraft();r.draft.choice=index;inputError=null;save();render();$(`.choice[data-index="${index}"]`)?.focus({preventScroll:true});}

 modalRestoreFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="overlay" id="modal-overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><div class="modal-header"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close-modal" aria-label="Close dialog">✕</button></div><div class="modal-body">${body}</div>${footer?`<div class="btn-row">${footer}</div>`:''}</section></div>`;

function reference(){return `<p>Use this sheet while you work. It lists methods, not the answer key.</p><div class="reference-grid">
 <div class="reference-item"><h4>Square of a sum</h4>${math('(u + v)<sup>2</sup> = u<sup>2</sup> + 2uv + v<sup>2</sup>')}<p>First square, twice the product, last square.</p></div>
 <div class="reference-item"><h4>Square of a difference</h4>${math('(u − v)<sup>2</sup> = u<sup>2</sup> − 2uv + v<sup>2</sup>')}<p>The middle is negative; the last square is positive.</p></div>
 <div class="reference-item"><h4>Factoring perfect squares</h4>${math('u<sup>2</sup> ± 2uv + v<sup>2</sup> = (u ± v)<sup>2</sup>')}<p>Check the middle term before assuming a perfect square.</p></div>
 <div class="reference-item"><h4>Exponent rules</h4>${math('x<sup>m</sup>x<sup>n</sup> = x<sup>m+n</sup><br>(x<sup>m</sup>)<sup>n</sup> = x<sup>mn</sup>')}<p>A power of a product applies to every factor.</p></div>
 <div class="reference-item"><h4>Scientific notation</h4>${math('a × 10<sup>n</sup>')}<p>1 ≤ |a| &lt; 10; n is an integer. A tiny positive decimal has a negative exponent.</p></div>
 <div class="reference-item"><h4>Distance</h4>${math('d = '+root('(Δx)<sup>2</sup> + (Δy)<sup>2</sup>'))}<p>Subtract coordinates in matching order. Distance is nonnegative.</p></div>
 <div class="reference-item"><h4>Circle</h4>${math('(x − h)<sup>2</sup> + (y − k)<sup>2</sup> = r<sup>2</sup>')}<p>Center (h, k); radius r. Take the square root of the right side.</p></div>
 <div class="reference-item"><h4>Slope</h4>${math('m = '+frac('y<sub>2</sub> − y<sub>1</sub>','x<sub>2</sub> − x<sub>1</sub>'))}<p>Horizontal: y = c, m = 0. Vertical: x = c, slope undefined.</p></div>
 <div class="reference-item"><h4>Solving equations</h4><p>Balance both sides. Clear fractions. Isolate a radical before squaring and check the original equation. When solving u² = k, consider ±√k where real and defined.</p></div>
 <div class="reference-item"><h4>Round-trip travel</h4>${math('v<sub>out</sub>t = v<sub>back</sub>(T − t)')}<p>Same route → same distance. Return time is total time minus outward time.</p></div></div>`;}

function help(){openModal('About this lesson',`<p><strong>Lesson 89 · Standard Forms</strong><br>Interactive adaptation of the supplied pages 433–436. Explanations and support exercises were written for this app. Original textbook exercise numbering is retained.</p><h3>How to use it</h3><p>Begin with the ten guided topics. Mark each topic read to unlock Practice 89. Complete those five exercises to unlock Problem Set 89. Solve each exercise or explicitly review its worked solution to continue. Your final report appears after all 26 exercises are complete.</p><h3>Typing mathematics</h3><p>Use ordinary keyboard text: <code>-8/5</code>, <code>5 1/2</code>, <code>sqrt(61)</code>, <code>√61</code>, or a decimal. Simple numeric arithmetic with +, −, *, /, ^, and parentheses is supported. Variable expressions are answered with the provided choices, not by an algebra parser. A radical such as √(9x) covers the entire product 9x.</p><p>For the first travel question, submit the time rounded to two decimal places as requested. For scientific notation, use the separate coefficient and exponent boxes.</p><h3>Saving & privacy</h3><p>The app makes no network requests and sends no student answers anywhere. It tries to save progress in this browser. Automatic storage may be blocked or cleared; use <strong>Save progress file</strong> as a portable backup, then <strong>Restore progress</strong> on another device. Moving or renaming the HTML file can create a separate saved session.</p><p>In a file or attachment preview, JavaScript may not run. Open the HTML in a full browser, or use its published static-site version. A site hosted on GitHub Pages requires a connection to load; the downloaded self-contained HTML requires no connection.</p><h3>Source fidelity</h3><p>Small symbols in Problem Set 89 #11, #12, and #16 are marked for checking. The app provides working transcriptions and embedded source crops; #11 and #12 use regenerated choices. Source checks are teacher/convenience controls, not password protection. All scores apply to the displayed expressions.</p><p>Source material retains its existing copyright. This adaptation does not relicense the textbook content.</p><div class="btn-row"><button class="btn secondary small" data-action="how-score">Scoring details</button><button class="btn secondary small" data-action="sources">Source checks</button><button class="btn secondary small" data-action="reset">Start a new attempt</button></div><p class="small muted" style="margin-top:18px">App version ${APP_VERSION}. No third-party fonts, scripts, or assets are loaded.</p>`);}
function sourceFormula(key,cfg){const q=buildQuestions(cfg).find(q=>q.sourceKey===key);if(key==='q11'||key==='q12')return q.prompt.match(/<div class="display-math">([\s\S]*)<\/div>/)?.[1]||'';const r=cfg.q16;return root(r.coefficient+'x')+' + '+r.add+' = '+r.rhs;}
function sourcesModal(){
 const fields={q11:[['c1','1st coefficient'],['x1','1st x exponent'],['y1','1st y exponent'],['z1','1st z exponent'],['c2','2nd coefficient'],['x2','2nd x exponent'],['y2','2nd y exponent'],['z2','2nd z exponent']],q12:[['c','Coefficient'],['a','a exponent'],['b','b exponent'],['cExp','c exponent'],['power','Outer power']],q16:[['coefficient','Inside coefficient'],['add','Added constant'],['rhs','Right-hand side']]};
 openModal('Check the source readings',`<p>The small print on page 436 is not fully legible. These are <strong>working transcriptions, not verified claims about the original symbols</strong>. Compare them with the original book or a clearer photo. The math and grading are calculated from the values shown below.</p><p class="small muted">#11 and #12 retain their textbook task and numbering, but their multiple-choice distractors are regenerated. Checking an expression does not make those choices exact copies of the book.</p><div id="source-error" class="error-inline" role="alert"></div>${Object.entries(fields).map(([key,fs])=>{const q=questions.find(q=>q.sourceKey===key),locked=rec(q).attempts.length>0||rec(q).revealed;return `<section class="source-item"><h3>Problem Set 89 · ${key.slice(1)}</h3><details><summary>View the supplied photo crop</summary>${SOURCE_IMAGES[key]?`<img class="source-image" src="${SOURCE_IMAGES[key]}" alt="Original photograph crop for Problem Set 89 question ${key.slice(1)}. Small symbols are blurry; compare with a clearer source.">`:'<p>Source crop unavailable.</p>'}</details><p class="small muted" style="margin:12px 0 5px">Current working expression:</p><div class="source-expression">${sourceFormula(key,state.source)}</div>${locked?'<p class="small muted">The values are locked because this question has a recorded submission or revealed solution. Save your report and start a new attempt to change them.</p>':''}<div class="source-fields">${fs.map(([f,label])=>`<label for="source-${key}-${f}">${label}<input class="text-input" type="number" step="1" id="source-${key}-${f}" data-source="${key}" data-field="${f}" value="${state.source[key][f]}" ${locked?'readonly':''}></label>`).join('')}</div><label class="check-label"><input type="checkbox" id="confirmed-${key}" ${state.source[key].confirmed?'checked':''}><span>I checked this displayed expression against my source. ${key!=='q16'?'I understand that the choices were regenerated.':''}</span></label></section>`;}).join('')}<p class="small muted">Changes and confirmation marks stay in this browser and in exported progress files. They do not rewrite the original HTML file. Numeric edits are limited to the currently supported monomial and square-root structures.</p>`,`<button class="btn" data-action="apply-sources">Save source settings</button><button class="btn secondary" data-action="close-modal">Cancel</button>`);
}
function applySources(){
 const draft=clone(state.source);$$('[data-source]', $('#modal-root')).forEach(i=>draft[i.dataset.source][i.dataset.field]=Number(i.value));for(const k of Object.keys(draft))draft[k].confirmed=$('#confirmed-'+k).checked;
 try{
  const validated=validateSource(draft);
  for(const q of questions.filter(q=>q.sourceKey)){
   const old=clone(state.source[q.sourceKey]),next=clone(validated[q.sourceKey]);delete old.confirmed;delete next.confirmed;
   if(JSON.stringify(old)!==JSON.stringify(next)&&(rec(q).attempts.length||rec(q).revealed))throw Error('Question '+q.label+' already has a result. Start a new attempt before changing its values.');
  }
  state.source=validated;questions=buildQuestions(state.source);save();closeModal();render();toast('Source settings saved for this browser.');
 }catch(e){$('#source-error').textContent=e.message;$('#source-error').scrollIntoView({block:'nearest'});}
}
function download(content,filename,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function timeStamp(){return new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);}
function saveProgress(){captureDraft();save();download(JSON.stringify(state,null,2),'lesson89_progress_'+timeStamp()+'.json','application/json');toast('Progress file prepared. Keep it to restore this session.');}
function reportText(){
 const s=stats(),lines=['LESSON 89 — STANDARD FORMS','Student: '+(state.name||'Not entered'),'Completed: '+(state.completedAt||'Not complete'),'App version: '+APP_VERSION,'',`FIRST-ATTEMPT LESSON SCORE: ${s.first}/${s.total} (${Math.round(1000*s.first/s.total)/10}%)`,`Practice 89: ${sectionScore('practice')}/5`,`Problem Set 89: ${sectionScore('problem')}/21`,`Solved (including corrections): ${s.solved}/26`,`Solved after correction: ${s.corrected}`,`Finished with solution: ${s.revealed}`,`Hints used: ${s.hints} across ${s.hinted} exercises`,`Submitted answers: ${s.attempts}`,'','SCORING','One point per exercise based on the first valid submission. All parts must be correct. Hints do not deduct points. Retrying does not overwrite the first-attempt score. Revealing before solving records zero points. Written work and concept quick checks are not automatically graded.','','SOURCE STATUS'];
 for(const key of['q11','q12','q16'])lines.push(`Problem Set ${key.slice(1)}: ${state.source[key].confirmed?'Expression marked checked by user':'UNCHECKED WORKING TRANSCRIPTION'} — ${plain(sourceFormula(key,state.source))}`);
 lines.push('Choices for #11 and #12 were regenerated. Scores apply to the displayed exercises, not a guaranteed exact transcription of blurry source symbols.','','EXERCISE REVIEW');
 for(const q of questions){const r=rec(q);lines.push('',`${q.section==='practice'?'Practice 89':'Problem Set 89'} — ${q.label} | ${q.skill}`,`Prompt: ${plain(q.prompt)}`,`First-attempt point: ${r.firstCorrect?1:0}`,`Solved: ${r.solved?'Yes':'No; solution reviewed'} | Submissions: ${r.attempts.length} | Hints: ${r.hints}`,`First submission: ${r.attempts.length?draftText(q,r.attempts[0].draft):'Solution viewed before submitting an answer'}`,`Answer: ${q.answerText}`);if(r.attempts.length>1)lines.push('Latest submission: '+draftText(q,r.attempts.at(-1).draft));if(r.notes)lines.push('Workspace (not automatically graded):',r.notes);lines.push('Worked solution:');q.solution.forEach((s,i)=>lines.push(`${i+1}. ${plain(s)}`));if(q.check)lines.push('Check: '+plain(q.check));}
 lines.push('','This local learning report is not a tamper-resistant assessment record.');return lines.join('\n');
}
function resetDialog(){confirmDialog('Start a new attempt?',`<p>This clears the current student’s answers, score, notes, and lesson checkpoints <strong>in this browser</strong>. Source-expression settings are kept.</p><p>Download the current report or a progress file before continuing if you need to retain this session.</p>`,'Clear progress & begin',()=>{const cfg=clone(state.source);state=freshState(cfg);questions=buildQuestions(cfg);save();render();focusMain();toast('A new attempt is ready. Source settings were retained.');},true);}
function conceptModal(id){const l=lessons.find(l=>l.id===id);if(!l)return;openModal(l.title,`<p class="lesson-intro">${l.intro}</p>${l.body}${worked(l,true)}${(l.after||'').replace('<div id="pattern-lab"></div>','')}<p class="small muted">This is an open-resource concept review. Returning to your question will preserve your answer and notes.</p>`);}

/* Delegated events keep navigation and form handling independent of rendering. */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;
 if(el.tagName==='BUTTON'&&el.type!=='submit')e.preventDefault();
 if(action==='home'){captureDraft();setView('home');}
 else if(action==='resume')resume();
 else if(action==='nav-learn'){setView('learn');}
 else if(action==='nav-practice'){if(state.read.length===lessons.length)setView(sectionDone('practice')?'practice':'practice-intro');}
 else if(action==='nav-problem'){if(sectionDone('practice')===5)setView(sectionDone('problem')?'problem':'problem-intro');}
 else if(action==='nav-results'){if(allDone())setView('results');}
 else if(action==='lesson'){state.lessonIndex=Number(el.dataset.index);setView('learn');}
 else if(action==='previous-lesson'){state.lessonIndex=Math.max(0,state.lessonIndex-1);setView('learn');}
 else if(action==='complete-topic'){
  const l=lessons[state.lessonIndex];if(!state.read.includes(l.id))state.read.push(l.id);
  if(state.lessonIndex<lessons.length-1){state.lessonIndex++;setView('learn');}
  else if(state.read.length===lessons.length)setView('practice-intro');
  else{state.lessonIndex=lessons.findIndex(l=>!state.read.includes(l.id));setView('learn');toast('Read the remaining topic to unlock Practice 89.');}
 }
 else if(action==='next-step'){const l=lessons.find(l=>l.id===el.dataset.id);state.stepCounts[l.id]=Math.min(l.steps.length,(state.stepCounts[l.id]||1)+1);save();render();announce('Next example step revealed.');}
 else if(action==='mini'){state.mini[el.dataset.id]=Number(el.dataset.index);save();render();$(`.mini-option[data-index="${el.dataset.index}"]`)?.focus({preventScroll:true});const l=lessons.find(l=>l.id===el.dataset.id);announce(state.mini[l.id]===l.mini.correct?'Correct. '+l.mini.explain:'Take another look and try again.');}
 else if(action==='lab-sign'){state.lab.sign=Number(el.dataset.value);save();renderLab();$(`.segmented [data-value="${state.lab.sign}"]`)?.focus({preventScroll:true});}
 else if(action==='start-section'){
  const s=el.dataset.section;if(s==='practice'&&state.read.length<lessons.length)return;if(s==='problem'&&sectionDone('practice')<5)return;
  const idx=sectionQuestions(s).findIndex(q=>!rec(q).done);state.indices[s]=idx<0?0:idx;setView(s);
 }
 else if(action==='question'){const s=el.dataset.section,i=Number(el.dataset.index);if(!sectionQuestions(s).slice(0,i).every(q=>rec(q).done))return;captureDraft();state.indices[s]=i;setView(s);}
 else if(action==='choose')chooseAnswer(Number(el.dataset.index));
 else if(action==='hint'){
  const q=getQuestion(),r=rec(q);if(r.done)return;captureDraft();r.hints=Math.min(q.hints.length,r.hints+1);save();render();$('.hint-box')?.scrollIntoView({block:'nearest',behavior:'smooth'});announce('Hint '+r.hints+': '+q.hints[r.hints-1]);
 }
 else if(action==='reveal'){
  const q=getQuestion(),r=rec(q);if(r.done)return;captureDraft();save();confirmDialog('Finish with the worked solution?',`<p>This will reveal the complete solution and mark this exercise as <strong>solution reviewed</strong>, not solved. Its first-attempt point will be <strong>0</strong>.</p><p>Your previous work is kept. You can instead cancel and continue working with hints.</p>`,'Reveal solution & finish',()=>{if(r.firstCorrect===null)r.firstCorrect=false;r.revealed=true;r.done=true;r.solved=false;r.feedback='revealed';r.solutionOpen=true;finishCheck();save();render();$('.feedback')?.scrollIntoView({block:'nearest'});announce('Solution revealed. This exercise is complete with zero first-attempt points.');});
 }
 else if(action==='previous-question'){captureDraft();state.indices[state.view]=Math.max(0,state.indices[state.view]-1);setView(state.view);}
 else if(action==='next-question'){
  const q=getQuestion();if(!rec(q).done)return;captureDraft();const s=state.view,qs=sectionQuestions(s);
  if(state.indices[s]<qs.length-1){state.indices[s]++;setView(s);}else if(s==='practice')setView('problem-intro');else if(allDone()){finishCheck();setView('results');}
 }
 else if(action==='reference'){captureDraft();openModal('Your reference sheet',reference());}
 else if(action==='how-score')openModal('A score that keeps learning visible',scoreHelp());
 else if(action==='help')help();
 else if(action==='concept'){captureDraft();conceptModal(el.dataset.id);}
 else if(action==='sources'){captureDraft();sourcesModal();}
 else if(action==='apply-sources')applySources();
 else if(action==='close-modal')closeModal();
 else if(action==='confirm-modal'){const fn=modalAction;closeModal();if(fn)fn();}
 else if(action==='save-progress')saveProgress();
 else if(action==='load-progress')$('#progress-file').click();
 else if(action==='download-report'){if(allDone())download(reportText(),'lesson89_report_'+timeStamp()+'.txt','text/plain;charset=utf-8');}
 else if(action==='print-report'){
  if(!allDone())return;const oldFilter=state.reportFilter;state.reportFilter='all';render();$$('.result-row').forEach(d=>d.open=true);window.print();state.reportFilter=oldFilter;render();
 }
 else if(action==='filter'){state.reportFilter=el.dataset.filter;save();render();$('.report-filter')?.scrollIntoView({block:'nearest'});}
 else if(action==='reset')resetDialog();
});
document.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();doSubmit();}});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='student-name'){state.name=el.value.slice(0,100);save();}
 else if(el.classList.contains('answer-input')&&['practice','problem'].includes(state.view)){const r=rec(getQuestion());if(!r.done){r.draft.values[el.dataset.field]=el.value.slice(0,160);save();}}
 else if(el.id==='scratchpad'&&['practice','problem'].includes(state.view)){rec(getQuestion()).notes=el.value.slice(0,5000);save();}
 else if(el.id==='lab-number'){
  state.lab.a=Number(el.value);save();const {a,sign}=state.lab,s=sign===1?'+':'−';$('.range-wrap strong').textContent=a;
  $('.product-table').innerHTML=`<caption>This is an algebraic multiplication table; signed entries are products, not negative physical areas.</caption><thead><tr><th scope="col">×</th><th scope="col">x</th><th scope="col">${s} ${a}</th></tr></thead><tbody><tr><th scope="row">x</th><td>x<sup>2</sup></td><td class="middle">${s} ${a===1?'':a}x</td></tr><tr><th scope="row">${s} ${a}</th><td class="middle">${s} ${a===1?'':a}x</td><td>+ ${a*a}</td></tr></tbody>`;
  $('.lab-result').innerHTML=`(x ${s} ${a})<sup>2</sup> = x<sup>2</sup> ${s} ${2*a}x + ${a*a}`;
 }
});
document.addEventListener('toggle',e=>{if(!['practice','problem'].includes(state.view))return;const r=rec(getQuestion());if(e.target.id==='work-area'&&r.workOpen!==e.target.open){r.workOpen=e.target.open;save();}if(e.target.classList?.contains('solution')&&r.solutionOpen!==e.target.open){r.solutionOpen=e.target.open;save();}},true);
document.addEventListener('keydown',e=>{
 const modal=$('#modal-root .modal');
 if(modal){
  if(e.key==='Escape'){e.preventDefault();closeModal();return;}
  if(e.key==='Tab'){const nodes=$$('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),summary,a[href],[tabindex="0"]',modal).filter(n=>n.getClientRects().length),first=nodes[0],last=nodes.at(-1);if(!first){e.preventDefault();modal.focus();}else if(e.shiftKey&&(document.activeElement===first||document.activeElement===modal)){e.preventDefault();last.focus();}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===modal)){e.preventDefault();first.focus();}}
  return;
 }
 if(e.target.matches('.choice')&&['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)){
  const q=getQuestion();if(rec(q).done)return;e.preventDefault();const dir=['ArrowDown','ArrowRight'].includes(e.key)?1:-1;chooseAnswer((Number(e.target.dataset.index)+dir+q.choices.length)%q.choices.length);
 }
});
$('#modal-root').addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal();});
$('#progress-file').addEventListener('change',async e=>{
 const file=e.target.files?.[0];if(!file)return;e.target.value='';
 try{if(file.size>2_000_000)throw Error('This file is too large to be a Lesson 89 progress file.');const restored=normalizeLoaded(JSON.parse(await file.text()));const completed=Object.values(restored.answers).filter(r=>r.done).length;
 confirmDialog('Restore this saved lesson?',`<p>Student: <strong>${esc(restored.name||'Not entered')}</strong><br>Completed exercises: <strong>${completed} of 26</strong></p><p>This replaces the active lesson in this browser. Save your current progress first if you need both sessions.</p>`,'Restore lesson',()=>{state=restored;questions=buildQuestions(state.source);save();render();focusMain();toast('Saved lesson restored.');});
 }catch(err){openModal('The progress file was not restored',`<p>${esc(err.message)}</p><p>Your current lesson has not been changed.</p>`);}
});
window.addEventListener('beforeunload',()=>{captureDraft();save();});
window.addEventListener('pagehide',()=>{captureDraft();save();});
render();if(initialWarning)toast(initialWarning);
/* The test interface is only enabled in a deliberately requested test URL.
   It is not a security boundary; an offline educational app is not an exam lock. */
if(new URLSearchParams(location.search).has('test'))window.Lesson89Test={parseNumber,grade,buildQuestions,normalizeLoaded,getState:()=>state,getQuestions:()=>questions,render,stats,save,plain,validateSource};
})();

</script>
</body></html>
