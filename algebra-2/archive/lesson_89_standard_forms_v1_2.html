o decimal places. Scientific notation uses separate coefficient and exponent boxes.</p><h3>Saving & privacy</h3><p>The app sends no answers anywhere and makes no network requests. It tries to save your work in this browser. Use <strong>Save progress file</strong> for a portable backup; automatic browser storage can be blocked or cleared. Moving or renaming the HTML file can create a different saved session.</p><p>This version uses a separate browser save slot. To carry work over, save a progress file in the earlier app and restore it here. Version 1.1 submission history is re-evaluated under the new scoring policy; earlier tries remain used, and a previously uncredited second-try fill-in answer can now earn a point. Version 1.0 additionally reopens the questions affected by the earlier source correction. The restore dialog identifies changes before replacing the active session.</p><p>Open the HTML in a full browser, not an attachment preview. The downloaded self-contained file works without a connection. A hosted static page needs a connection for its initial load. This is an open-resource learning app, not a secured exam.</p><h3>Source boundaries</h3><p>The supplied textbook pages establish the mathematical content. Clearer close-ups received October 2, 2026 confirmed questions #11–21, including #11, #12, and #16. Original printed choices are retained for #11 and #12; #16 is √(9x) + 5 = 11. Explanations, hints, quick checks, travel-equation choices, and the redrawn slope graph are app-authored instructional support. No textbook photographs are embedded.</p><p>Source material retains its existing copyright. This adaptation does not relicense it. No third-party fonts, scripts, images, or sound assets are loaded.</p><div class="btn-row"><button class="btn secondary small" data-action="how-score">Scoring details</button><button class="btn secondary small" data-action="settings">Sound & feedback</button><button class="btn secondary small" data-action="sources">Lesson source</button></div>`);}
function sourceFormula(key){
 const q=buildQuestions().find(q=>q.sourceKey===key);
 if(key==='q11'||key==='q12')return q.prompt.match(/<div class="display-math">([\s\S]*)<\/div>/)?.[1]||'';
 const r=DEFAULT_SOURCE.q16;return root(r.coefficient+'x')+' + '+r.add+' = '+r.rhs;
}
function sourcesModal(){
 openModal('Lesson source',`<p><strong>Source edition: October 2, 2026 close-ups.</strong> This interactive lesson uses the information from the supplied textbook pages 433–436. The original exercises are presented as live text, mathematical notation, input controls, and a redrawn coordinate graph—not as photographs.</p><h3>Confirmed expressions</h3>${['q11','q12','q16'].map(key=>`<section class="source-item"><h3>Problem Set 89 · ${key.slice(1)}</h3><div class="source-expression">${sourceFormula(key)}</div></section>`).join('')}<p>For #11 and #12, all five printed choices are reproduced in their original A–E order. For #16, the square-root bar covers <strong>9x only</strong>; the +5 is outside the root. Questions #13–21 and the labeled slope coordinates were checked against the additional close-ups.</p><h3>What the app adds</h3><p>The explanations, hints, step-by-step worked solutions, quick checks, workspace, equation choices for the travel exercises, and scoring interface are app-authored instructional support. Original question numbers and mathematical tasks are retained.</p><p class="small muted">The lesson values are fixed in this edition. This panel documents source fidelity; it is not an exercise editor. Source material retains its existing copyright. This adaptation does not relicense the textbook content.</p>`,`<button class="btn" data-action="close-modal">Return to lesson</button>`);
}
function download(content,filename,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function timeStamp(){return new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);}
function saveProgress(){captureDraft();save();download(JSON.stringify(state,null,2),'lesson89_progress_'+timeStamp()+'.json','application/json');toast('Progress file prepared. Keep it to restore this session.');}

function reportText(){
 const s=stats(),finished=allDone(),lines=['LESSON 89 — STANDARD FORMS','Student: '+(state.name||'Not entered'),'Report: '+(finished?'FINAL EXERCISE SCORE':'IN PROGRESS — NOT A FINAL GRADE'),'Completed: '+(state.completedAt||'Not complete'),'App version: '+APP_VERSION,'Scoring policy: '+SCORE_POLICY,'',`${finished?'FINAL SCORE':'POINTS EARNED SO FAR'}: ${s.credit}/${s.total}${finished?' ('+Math.round(1000*s.credit/s.total)/10+'%)':''}`,`Practice 89: ${sectionScore('practice')}/5 points; ${sectionDone('practice')}/5 complete`,`Problem Set 89: ${sectionScore('problem')}/21 points; ${sectionDone('problem')}/21 complete`,`Guided topics marked read: ${state.read.length}/10 (unscored)`,`Exercises complete: ${s.done}/26`,`Solved including corrections: ${s.solved}/26`,`Credit earned on second fill-in try: ${s.secondCredit}`,`Solved without credit: ${s.noCredit}`,`Solution reviewed: ${s.revealed}`,`In progress: ${s.inProgress}; not started: ${s.notStarted}`,`Hints used: ${s.hints}; valid submissions: ${s.attempts}`,'','SCORING','One point per exercise. Multiple choice: one credit-bearing try. Fill-in: two credit-bearing tries. Later correct answers count as solved without credit.','For travel questions, the equation has one credit try and typed time has two; both must qualify. Correct components are retained. Multiple fill-in boxes are one response.','Hints do not deduct points. Blank or unreadable responses do not consume tries. Revealing a solution before solving gives zero points. Notes and concept checks are unscored.','Navigation never consumes tries or marks work complete. The final score requires all 26 exercises solved or solution-reviewed.','','SOURCE','Confirmed textbook pages 433–436, including October 2, 2026 close-ups. The 1.1 mathematical content is retained. No photographs are embedded.'];
 if(state.migration?.resetQuestions?.length)lines.push('Source migration reopened: '+state.migration.resetQuestions.join(', ')+'. Earlier notes and unaffected results retained.');
 if(state.scoringMigration)lines.push('Scoring migration from '+state.scoringMigration.fromVersion+': existing history re-evaluated under the new limits; no extra tries. Point changes on import: '+(state.scoringMigration.changedQuestions.join(', ')||'none')+'.');
 lines.push('','EXERCISE REVIEW');
 for(const q of questions){const r=rec(q),c=scoringFor(q,r);lines.push('',`${q.section==='practice'?'Practice 89':'Problem Set 89'} — ${q.label} | ${q.skill}`,`Prompt: ${plain(q.prompt)}`,`Status: ${statusInfo(q,r).label}`,`Points: ${c.credit}/1${!r.done&&c.possible?' (still available; not final)':''}`,`Submissions: ${r.attempts.length} | Hints: ${r.hints}`);
  for(const g of c.groups)lines.push(`${g.label}: ${g.solved?'correct on try '+g.correctAt+'; '+(g.earned&&!r.revealed?'credit-qualified':'no credit'):(r.revealed?0:g.remaining)+' credit tries remaining'}`);
  r.attempts.forEach((a,i)=>lines.push(`Try ${i+1}: ${draftText(q,a.draft)} | ${a.correct?'correct':'not fully correct'}`));
  if(!r.done&&hasDraft(r))lines.push('Current draft (not graded): '+draftText(q,r.draft));
  if(r.notes)lines.push('Workspace (not graded):',r.notes);
  if(r.done){lines.push('Answer: '+q.answerText,'Worked solution:');q.solution.forEach((t,i)=>lines.push(`${i+1}. ${plain(t)}`));if(q.check)lines.push('Check: '+plain(q.check));}
  else lines.push('Answer and solution withheld while this exercise is unfinished.');
 }
 lines.push('','This local learning report is not a tamper-resistant assessment record.');return lines.join('\n');
}
function resetDialog(){confirmDialog('Start a new attempt?',`<p>This clears the current student’s answers, score, notes, and lesson checkpoints <strong>in this browser</strong>. The confirmed lesson content is unchanged.</p><p>Download the current report or a progress file before continuing if you need to retain this session.</p>`,'Clear progress & begin',()=>{const prefs=clone(state.prefs);stopCue();state=freshState();state.prefs=prefs;questions=buildQuestions();save();render();focusMain();toast('A new attempt is ready. Sound and feedback preferences were retained.');},true);}
function conceptModal(id){const l=lessons.find(l=>l.id===id);if(!l)return;openModal(l.title,`<p class="lesson-intro">${l.intro}</p>${l.body}${worked(l,true)}${(l.after||'').replace('<div id="pattern-lab"></div>','')}<p class="small muted">This is an open-resource concept review. Returning to your question will preserve your answer and notes.</p>`);}


/* Capture the active draft BEFORE changing a section or question index. */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;
 if(el.tagName==='BUTTON'&&el.type!=='submit')e.preventDefault();
 captureDraft();
 if(['home','resume','nav-learn','nav-practice','nav-problem','nav-results','lesson','question'].includes(action)&&$('#modal-root .modal'))closeModal();
 if(action==='home')setView('home');
 else if(action==='resume')resume();
 else if(action==='nav-learn')setView('learn');
 else if(action==='nav-practice')setView('practice');
 else if(action==='nav-problem')setView('problem');
 else if(action==='nav-results')setView('results');
 else if(action==='jump'){save();jumpModal();}
 else if(action==='lesson'){const i=Number(el.dataset.index);if(validInt(i,0,lessons.length-1)){state.lessonIndex=i;setView('learn');}}
 else if(action==='previous-lesson'){state.lessonIndex=Math.max(0,state.lessonIndex-1);setView('learn');}
 else if(action==='toggle-read'){const id=lessons[state.lessonIndex].id;state.read=state.read.includes(id)?state.read.filter(x=>x!==id):[...state.read,id];save();render();$('[data-action="toggle-read"]')?.focus({preventScroll:true});announce(state.read.includes(id)?'Topic marked read.':'Topic marked unread.');}
 else if(action==='complete-topic'||action==='skip-topic'){
  if(action==='complete-topic'){const id=lessons[state.lessonIndex].id;if(!state.read.includes(id))state.read.push(id);}
  if(state.lessonIndex<lessons.length-1){state.lessonIndex++;setView('learn');}else setView('practice-intro');
 }
 else if(action==='next-step'){const l=lessons.find(l=>l.id===el.dataset.id);if(!l)return;state.stepCounts[l.id]=Math.min(l.steps.length,(state.stepCounts[l.id]||1)+1);save();render();announce('Next example step revealed.');}
 else if(action==='mini'){
  state.mini[el.dataset.id]=Number(el.dataset.index);save();render();$(`.mini-option[data-index="${el.dataset.index}"]`)?.focus({preventScroll:true});const l=lessons.find(l=>l.id===el.dataset.id),correct=state.mini[l.id]===l.mini.correct;playCue(correct?'correct':'wrong');announce((correct?'Correct. '+l.mini.explain:'Incorrect. Take another look and try again.')+' This concept check is not scored.');
 }
 else if(action==='lab-sign'){state.lab.sign=Number(el.dataset.value);save();renderLab();$(`.segmented [data-value="${state.lab.sign}"]`)?.focus({preventScroll:true});}
 else if(action==='start-section'){const section=el.dataset.section;if(!['practice','problem'].includes(section))return;const idx=sectionQuestions(section).findIndex(q=>!rec(q).done);state.indices[section]=idx<0?0:idx;setView(section);}
 else if(action==='question')goQuestion(el.dataset.section,Number(el.dataset.index));
 else if(action==='choose')chooseAnswer(Number(el.dataset.index));
 else if(action==='hint'){const q=getQuestion(),r=rec(q);if(r.done)return;r.hints=Math.min(q.hints.length,r.hints+1);save();render();$('.hint-box')?.scrollIntoView({block:'nearest',behavior:'auto'});announce('Hint '+r.hints+': '+q.hints[r.hints-1]);}
 else if(action==='reveal'){
  const q=getQuestion(),r=rec(q);if(r.done)return;save();confirmDialog('Reveal the solution without credit?',`<p>This reveals the complete solution and marks this exercise <strong>solution reviewed</strong>, not independently solved. It receives <strong>0 points</strong>, even if a credit-bearing try remains.</p><p>You do not need to reveal the answer to move elsewhere. Cancel and use Next or Jump to if you prefer to return later.</p>`,'Reveal solution & finish',()=>{r.revealed=true;r.feedback='revealed';r.solutionOpen=true;syncRecord(q,r);finishCheck();save();feedbackPulseFor=q.id;render();$('#answer-feedback')?.scrollIntoView({block:'center'});$('#answer-feedback')?.focus({preventScroll:true});});
 }
 else if(action==='previous-question'){const section=state.view;goQuestion(section,Math.max(0,state.indices[section]-1));}
 else if(action==='next-question'){const section=state.view,qs=sectionQuestions(section);if(state.indices[section]<qs.length-1)goQuestion(section,state.indices[section]+1);else if(section==='practice')setView('problem-intro');else{finishCheck();setView('results');}}
 else if(action==='reference')openModal('Your reference sheet',reference());
 else if(action==='how-score')openModal('Credit rules and progress',scoreHelp());
 else if(action==='help')help();
 else if(action==='concept')conceptModal(el.dataset.id);
 else if(action==='sources')sourcesModal();
 else if(action==='settings')settingsModal();
 else if(action==='toggle-sound'){state.prefs.sound=!state.prefs.sound;stopCue();save();toast(state.prefs.sound?'Sound enabled. Use Sound & feedback to adjust volume or preview cues.':'Answer sounds muted. Visual feedback stays on.');}
 else if(action==='test-sound'){if(!state.prefs.sound||state.prefs.volume===0){toast('Enable sounds and set the cue volume above zero to preview.');return;}playCue(el.dataset.kind==='correct'?'correct':'wrong');}
 else if(action==='close-modal')closeModal();
 else if(action==='confirm-modal'){const fn=modalAction;closeModal();if(fn)fn();}
 else if(action==='save-progress')saveProgress();
 else if(action==='load-progress')$('#progress-file').click();
 else if(action==='download-report')download(reportText(),'lesson89_'+(allDone()?'final':'progress')+'_report_'+timeStamp()+'.txt','text/plain;charset=utf-8');
 else if(action==='print-report'){
  const oldFilter=state.reportFilter;state.reportFilter='all';render();$$('.result-row').forEach(d=>d.open=true);window.print();state.reportFilter=oldFilter;render();
 }
 else if(action==='filter'){state.reportFilter=el.dataset.filter;save();render();$('.report-filter')?.scrollIntoView({block:'nearest'});}
 else if(action==='reset')resetDialog();
});
document.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();doSubmit();}});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='student-name'){state.name=el.value.slice(0,100);save();}
 else if(el.classList.contains('answer-input')&&['practice','problem'].includes(state.view)){const q=getQuestion(),r=rec(q);if(!r.done&&!groupInfo(q,r,'fields')?.solved){r.draft.values[el.dataset.field]=el.value.slice(0,160);save();}}
 else if(el.id==='scratchpad'&&['practice','problem'].includes(state.view)){rec(getQuestion()).notes=el.value.slice(0,5000);save();}
 else if(el.id==='setting-volume'){state.prefs.volume=Math.max(0,Math.min(30,Number(el.value)));$('#volume-value').textContent=state.prefs.volume+'%';stopCue();save();}
 else if(el.id==='lab-number'){
  state.lab.a=Number(el.value);save();const {a,sign}=state.lab,s=sign===1?'+':'−';$('.range-wrap strong').textContent=a;
  $('.product-table').innerHTML=`<caption>This is an algebraic multiplication table; signed entries are products, not negative physical areas.</caption><thead><tr><th scope="col">×</th><th scope="col">x</th><th scope="col">${s} ${a}</th></tr></thead><tbody><tr><th scope="row">x</th><td>x<sup>2</sup></td><td class="middle">${s} ${a===1?'':a}x</td></tr><tr><th scope="row">${s} ${a}</th><td class="middle">${s} ${a===1?'':a}x</td><td>+ ${a*a}</td></tr></tbody>`;
  $('.lab-result').innerHTML=`(x ${s} ${a})<sup>2</sup> = x<sup>2</sup> ${s} ${2*a}x + ${a*a}`;
 }
});
document.addEventListener('change',e=>{if(e.target.id==='setting-sound'){state.prefs.sound=e.target.checked;stopCue();save();}else if(e.target.id==='setting-motion'){state.prefs.motion=e.target.checked;save();}});
document.addEventListener('toggle',e=>{if(!['practice','problem'].includes(state.view))return;const r=rec(getQuestion());if(e.target.id==='work-area'&&r.workOpen!==e.target.open){r.workOpen=e.target.open;save();}if(e.target.classList?.contains('solution')&&r.solutionOpen!==e.target.open){r.solutionOpen=e.target.open;save();}},true);
document.addEventListener('keydown',e=>{
 const modal=$('#modal-root .modal');
 if(modal){
  if(e.key==='Escape'){e.preventDefault();closeModal();return;}
  if(e.key==='Tab'){const nodes=$$('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),summary,a[href],[tabindex="0"]',modal).filter(n=>n.getClientRects().length),first=nodes[0],last=nodes.at(-1);if(!first){e.preventDefault();modal.focus();}else if(e.shiftKey&&(document.activeElement===first||document.activeElement===modal)){e.preventDefault();last.focus();}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===modal)){e.preventDefault();first.focus();}}
  return;
 }
 if(e.target.matches('.choice')&&['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)){
  const q=getQuestion();if(rec(q).done||groupInfo(q,rec(q),'choice')?.solved)return;e.preventDefault();const dir=['ArrowDown','ArrowRight'].includes(e.key)?1:-1;chooseAnswer((Number(e.target.dataset.index)+dir+q.choices.length)%q.choices.length);
 }
});
$('#modal-root').addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal();});
$('#progress-file').addEventListener('change',async e=>{
 const file=e.target.files?.[0];if(!file)return;e.target.value='';
 try{
  if(file.size>20_000_000)throw Error('This file is too large to restore in this app (20 MB maximum).');
  const incoming=JSON.parse(await file.text()),restored=normalizeLoaded(incoming),completed=Object.values(restored.answers).filter(r=>r.done).length;
  confirmDialog('Restore this saved lesson?',`<p>Student: <strong>${esc(restored.name||'Not entered')}</strong><br>Completed exercises: <strong>${completed} of 26</strong></p><p>This replaces the active session. Save the current progress first to retain both sessions.</p>${incoming.version!==APP_VERSION?`<div class="notice info"><strong>New scoring rules will apply.</strong> Existing version ${esc(incoming.version)} submission history is re-evaluated: 1 credit try for multiple choice, 2 for fill-in answers. Earlier submissions still count. ${restored.scoringMigration?.changedQuestions.length||0} exercise point results change under the new policy. Correct parts of travel exercises are retained.</div>`:''}${incoming.version==='1.0.0'&&restored.migration?.resetQuestions?.length?`<div class="notice"><strong>Source correction:</strong> Problem Set ${restored.migration.resetQuestions.map(id=>'#'+id.slice(2)).join(', ')} requires new answers. Notes and unaffected exercises are kept.</div>`:''}`,'Restore lesson',()=>{stopCue();state=restored;questions=buildQuestions();finishCheck();save();render();focusMain();toast('Saved lesson restored. Drafts, attempt history, and progress are ready.');});
 }catch(err){openModal('The progress file was not restored',`<p>${esc(err.message)}</p><p>Your current lesson has not been changed.</p>`);}
});
window.addEventListener('beforeunload',()=>{captureDraft();save();});
window.addEventListener('pagehide',()=>{captureDraft();save();stopCue();});
finishCheck();render();if(initialWarning)toast(initialWarning);
/* A deliberately requested testing hook, not an exam-security boundary. */
if(new URLSearchParams(location.search).has('test'))window.Lesson89Test={parseNumber,grade,buildQuestions,normalizeLoaded,getState:()=>state,getQuestions:()=>questions,render,stats,save,plain,validateSource,lessons,reportText,scoringFor,syncRecord,blankRecord,freshState,scheduleCue,audioDiagnostics,getAudioState:()=>audioContext?.state||'not-created',doSubmit,goQuestion,allDone};
})();
